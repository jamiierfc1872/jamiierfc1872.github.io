<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e1211">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gut Tracker</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    /* neutrals carry a slight green bias so they sit with the accent
       rather than reading as generic grey */
    --bg:#0e1211;
    --surface:#171b1a;
    --surface2:#202523;
    --border:#2d3432;
    --text:#f1f4f3;
    --muted:#98a3a0;
    --accent:#4ade80;
    --warn:#fbbf24;
    --bad:#f87171;
    --radius:14px;
  }
  button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(76px + env(safe-area-inset-bottom));
    overscroll-behavior-y:contain;
  }
  /* top pad clears the iPhone status bar - the app draws full-screen */
  .wrap{max-width:620px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 18px 8px}

  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px}
  header h1{font-size:19px;font-weight:600;letter-spacing:-0.01em}
  header .count{font-size:13px;color:var(--muted)}
  header .count b{color:var(--accent);font-weight:600}

  h2{font-size:15px;font-weight:600;margin:26px 0 12px;letter-spacing:-0.01em}
  h2:first-child{margin-top:0}
  .hint{font-size:13px;color:var(--muted);margin:-6px 0 14px}

  /* big action buttons */
  .actions{display:grid;gap:12px}
  .action{
    display:flex;align-items:center;gap:14px;width:100%;
    background:var(--surface);border:1px solid var(--border);
    color:var(--text);border-radius:var(--radius);
    padding:20px 18px;font-size:17px;font-weight:500;text-align:left;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .action:active{background:var(--surface2)}
  .action svg{flex:0 0 24px;width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .action.secondary{padding:15px 18px;font-size:15px}
  .action.secondary svg{stroke:var(--muted);flex-basis:20px;width:20px;height:20px}

  /* forms */
  .field{margin-bottom:20px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
  input[type=text],input[type=time],input[type=date],input[type=number],textarea,select{
    width:100%;background:var(--surface);border:1px solid var(--border);
    color:var(--text);border-radius:10px;padding:13px 14px;font-size:16px;font-family:inherit;
  }
  textarea{resize:vertical;min-height:74px}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}

  .seg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .seg.two{grid-template-columns:1fr 1fr;gap:10px}
  .seg button{
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:18px 4px;min-height:58px;font-size:17px;font-weight:600;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .seg.two button{padding:15px;font-size:15px;font-weight:500}
  .seg.four{grid-template-columns:repeat(4,1fr);gap:8px}
  .seg.four button{padding:14px 2px;min-height:0;font-size:14px;font-weight:500}
  .seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#0e1211}
  .seglabels{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
  .seglabels span{font-size:10px;color:var(--muted);text-align:center;line-height:1.25}

  .slider{display:flex;align-items:center;gap:14px}
  .slider input[type=range]{flex:1;-webkit-appearance:none;appearance:none;background:transparent;height:34px}
  .slider input[type=range]::-webkit-slider-runnable-track{height:5px;background:var(--surface2);border-radius:99px}
  .slider input[type=range]::-moz-range-track{height:5px;background:var(--surface2);border-radius:99px}
  .slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--accent);margin-top:-11px;border:none}
  .slider input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--accent);border:none}
  .slider input[type=range]:focus{outline:2px solid var(--accent);outline-offset:4px;border-radius:8px}
  .slider .val{min-width:30px;text-align:right;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips button{
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    border-radius:99px;padding:10px 15px;font-size:14px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .chips button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#0e1211;font-weight:600}
  .chips.suggest button{border-style:dashed;color:var(--muted)}
  .chips.suggest button.all{border-style:solid;border-color:var(--accent);color:var(--accent);font-weight:600}

  .btn{
    width:100%;background:var(--accent);border:none;color:#0e1211;
    border-radius:12px;padding:17px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);font-weight:500}
  .btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad);font-weight:500}
  .btn+.btn{margin-top:10px}

  /* lists */
  .entry{
    display:flex;gap:13px;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:14px 15px;margin-bottom:9px;
  }
  .entry .time{flex:0 0 46px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
  .entry .body{flex:1;min-width:0}
  .entry .title{font-size:15px;font-weight:600;margin-bottom:3px}
  .entry .meta{font-size:13px;color:var(--muted)}
  /* negative margins let the hit area fill the card's padding, so the target is
     ~44px without changing how it looks */
  .entry .del{
    flex:0 0 auto;background:none;border:none;color:var(--muted);
    font-size:22px;line-height:1;cursor:pointer;
    min-width:44px;margin:-14px -15px -14px 0;
    display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  .entry .del:active{color:var(--bad)}
  .daygroup{font-size:13px;color:var(--muted);margin:22px 0 10px;font-weight:600}
  .daygroup:first-child{margin-top:0}

  /* stats */
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px}
  .stat .k{font-size:13px;color:var(--muted);margin-bottom:6px}
  .stat .v{font-size:26px;font-weight:700;letter-spacing:-0.02em}
  .stat .v small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0}
  .stat .sub{font-size:13px;color:var(--muted);margin-top:7px;line-height:1.45}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid2 .stat{margin-bottom:0}
  .bars{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:12px}
  .bars div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
  .barlabels{display:flex;gap:4px;margin-top:6px}
  .barlabels span{flex:1;font-size:9px;color:var(--muted);text-align:center}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:500;font-size:12px}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:44px 20px;line-height:1.6}

  pre.summary{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:15px;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text);
    max-height:340px;overflow:auto;
  }

  /* bottom nav */
  nav{
    position:fixed;bottom:0;left:0;right:0;background:rgba(14,18,17,.94);
    backdrop-filter:blur(12px);border-top:1px solid var(--border);
    display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10;
  }
  nav button{
    flex:1;background:none;border:none;color:var(--muted);padding:11px 4px 13px;
    font-size:11px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;gap:4px;-webkit-tap-highlight-color:transparent;
  }
  nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  nav button[aria-current=page]{color:var(--accent)}

  .toast{
    position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--accent);color:#0e1211;padding:12px 22px;border-radius:99px;
    font-size:14px;font-weight:600;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;
    box-shadow:0 6px 24px rgba(0,0,0,.45);
  }
  .toast.show{opacity:1}
  .backlink{background:none;border:none;color:var(--muted);font-size:14px;font-family:inherit;cursor:pointer;padding:0;margin-bottom:18px}
  .flagbanner{
    background:#2b1416;border:1px solid var(--bad);border-radius:12px;
    padding:15px 16px;margin-bottom:18px;font-size:14px;line-height:1.55;color:#ffd9d9;
  }
  .flagbanner b{display:block;color:var(--bad);margin-bottom:5px;font-size:15px}
  .nudge{
    background:#2a2413;border:1px solid var(--warn);border-radius:12px;
    padding:14px 15px;margin-bottom:18px;font-size:14px;line-height:1.5;color:#ffeab0;
  }
  .nudge b{display:block;color:var(--warn);margin-bottom:4px;font-size:15px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1 id="screenTitle">Log</h1>
    <div class="count">Today: <b id="todayCount">0</b> bowel movements</div>
  </header>
  <main id="view"></main>
</div>

<nav>
  <button data-tab="log" aria-current="page">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Log</button>
  <button data-tab="today">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>History</button>
  <button data-tab="stats">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Patterns</button>
  <button data-tab="export">
    <svg viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4M4 21h16"/></svg>Export</button>
</nav>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ---------- storage ---------- */
var KEY = "gutTrackerV1";

/* Does this browser actually give us storage that survives a reload?
   Runs before anything else so the answer is trustworthy. */
var STORAGE = (function(){
  var r = {canWrite:false, survived:false, lastSeen:null, error:null};
  try{
    var prev = localStorage.getItem("gutTrackerProbe");
    if(prev){ r.survived = true; r.lastSeen = prev; }
    var now = new Date().toISOString();
    localStorage.setItem("gutTrackerProbe", now);
    r.canWrite = (localStorage.getItem("gutTrackerProbe") === now);
  }catch(e){
    r.error = (e && e.name ? e.name : "Error") + ": " + (e && e.message ? e.message : "blocked");
  }
  return r;
})();

var db = load();

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return {v:1, entries:[]};
    var d = JSON.parse(raw);
    if(!d || !Array.isArray(d.entries)) return {v:1, entries:[], deleted:[]};
    if(!Array.isArray(d.deleted)) d.deleted = [];
    return d;
  }catch(e){ return {v:1, entries:[], deleted:[]}; }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ alert("Couldn't save. If you're in a private browsing window, storage is blocked — use a normal tab."); }
}
function add(entry){
  entry.id = Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  db.entries.push(entry);
  db.entries.sort(function(a,b){ return a.ts < b.ts ? -1 : 1; });
  save();
  syncSoon();
}

function removeEntry(id){
  db.entries = db.entries.filter(function(e){ return e.id !== id; });
  if(!db.deleted) db.deleted = [];
  // tombstone, so a sync from the other device can't resurrect it
  if(db.deleted.indexOf(id) === -1) db.deleted.push(id);
  save();
  syncSoon();
}

/* ---------- sync ----------
   Local storage stays the source of truth; the server is a meeting point.
   Merging is by id both ends, so order and repetition don't matter, and it
   simply does nothing when the tailnet isn't reachable. */
var SYNC_URL = "https://167.99.206.65.sslip.io/gut-sync/data";
var KEY_STORE = "gutTrackerKey";
var sync = {busy:false, ok:null, error:null, at:null};
var syncTimer = null;

/* The sync key never appears in this file. It arrives once per device in the
   link fragment (#key=...), which browsers do not send to servers and do not
   put in logs. We stash it locally and strip it from the address bar. */
var syncKey = (function(){
  var m = /(?:^|[#&])key=([A-Za-z0-9_-]{16,})/.exec(location.hash || "");
  if(m){
    try{ localStorage.setItem(KEY_STORE, m[1]); }catch(e){}
    try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
    return m[1];
  }
  try{ return localStorage.getItem(KEY_STORE) || ""; }catch(e){ return ""; }
})();

function syncSoon(){
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, 1500);
}

function syncNow(){
  if(sync.busy || typeof fetch !== "function") return;
  if(!syncKey){ sync.ok = false; sync.error = "no sync key on this device"; return; }
  sync.busy = true;
  fetch(SYNC_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json", "Authorization":"Bearer " + syncKey},
    body: JSON.stringify({v:1, entries:db.entries, deleted:db.deleted || []})
  })
  .then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(function(merged){
    if(merged && Array.isArray(merged.entries)){
      db.entries = merged.entries;
      db.deleted = Array.isArray(merged.deleted) ? merged.deleted : [];
      db.lastSync = Date.now();
      save();
    }
    sync.busy = false; sync.ok = true; sync.error = null; sync.at = Date.now();
    // never redraw a form the user might be part-way through filling
    if(screen==="log" || screen==="today" || screen==="stats" || screen==="export") render();
  })
  .catch(function(e){
    sync.busy = false; sync.ok = false; sync.at = Date.now();
    sync.error = (e && e.message) ? e.message : "unreachable";
  });
}

/* ---------- helpers ---------- */
var BRISTOL = {
  1:"Hard lumps", 2:"Lumpy sausage", 3:"Cracked sausage", 4:"Smooth sausage",
  5:"Soft blobs", 6:"Mushy", 7:"Liquid"
};
var TAGS = ["Dairy","Milk","Cheese","Ice cream","Pasta","Bread","Onion / garlic",
            "Beans / pulses","Fruit","Fried / fatty","Spicy",
            "Red meat","Chicken","Takeaway","Eating out","Second helping",
            "Water","Squash / cordial","Fruit juice","Fizzy drink","Sugar-free drink",
            "Alcohol","Sweeteners"];
var MEDS = ["Loperamide","Fybogel","Buscopan","Peppermint oil","Other"];
var DRINKS = ["Water","Squash / cordial","Fruit juice","Fizzy drink","Sugar-free drink",
              "Milk","Tea / coffee","Alcohol","Other"];
var APP_VERSION = "v11 — 25 Jul 2026";

/* Words that hint at a tag. Deliberately cautious — a missed suggestion costs
   nothing, a wrong one quietly corrupts the data. Matched on word starts, so
   "strawberr" catches strawberry and strawberries. */
var TAG_HINTS = {
  "Fried / fatty":    ["pie","pastry","sausage","chip","fries","fried","batter","crisp","burger",
                       "bacon","pizza","curry","kebab","roast","cream","butter","mayo","chocolate",
                       "pakora","spring roll","fry up","fry-up","tikka","masala","korma","balti",
                       "bhaji","samosa"],
  "Red meat":         ["steak","beef","mince","lamb","pork","sausage","bacon","burger","ham",
                       "gammon","haggis","black pudding"],
  "Chicken":          ["chicken","turkey","nugget"],
  "Pasta":            ["pasta","spaghetti","lasagne","lasagna","macaroni","penne","tagliatelle",
                       "ravioli","noodle","carbonara"],
  "Bread":            ["bread","toast","roll","sandwich","bun","wrap","pitta","baguette","bagel",
                       "crumpet","naan","toastie","panini"],
  "Dairy":            ["milk","cheese","yoghurt","yogurt","cream","butter","custard","latte"],
  "Cheese":           ["cheese","cheesy","parmesan","cheddar","mozzarella"],
  "Milk":             ["milk","cereal","porridge"],
  "Ice cream":        ["ice cream","icecream","gelato","sundae","magnum"],
  "Onion / garlic":   ["onion","garlic","gravy","pie","curry","bolognese","stew","casserole","soup",
                       "stir fry","stir-fry","fajita","chilli","salsa","pesto","indian","tikka",
                       "masala","korma","balti","jalfrezi","biryani","bhuna","rogan","dhansak",
                       "saag","chow mein","black bean"],
  "Beans / pulses":   ["bean","lentil","chickpea","hummus","houmous","pea","dhal","dahl"],
  "Fruit":            ["apple","banana","orange","grape","berry","berries","melon","pear","peach",
                       "plum","mango","pineapple","strawberr","raspberr","blueberr","kiwi"],
  "Spicy":            ["spicy","chilli","chili","curry","jalapeno","sriracha","hot sauce","peri",
                       "madras","vindaloo","cajun","tabasco","balti","jalfrezi","bhuna","rogan",
                       "dhansak","arrabbiata"],
  "Takeaway":         ["takeaway","chippy","mcdonald","kfc","kebab","domino","just eat","uber eats",
                       "deliveroo","chinese","indian","subway","greggs"],
  "Eating out":       ["restaurant","pub","cafe","out for","meal out","ate out"],
  "Second helping":   ["second","extra portion","more of","refill","topped up"],
  "Alcohol":          ["beer","lager","wine","vodka","gin","whisky","whiskey","cider","rum",
                       "prosecco","spirits","cocktail","guinness"],
  "Fizzy drink":      ["pepsi","coke","cola","fizzy","lemonade","irn bru","irn-bru","sprite","fanta",
                       "soda","tango"],
  "Sugar-free drink": ["diet","zero","sugar free","sugar-free","no sugar","pepsi max","coke zero"],
  "Squash / cordial": ["squash","diluting","cordial","robinsons","ribena","vimto"],
  "Fruit juice":      ["orange juice","apple juice","fruit juice","smoothie","fresh juice"],
  "Water":            ["water"],
  "Sweeteners":       ["sweetener","aspartame","sucralose","stevia","sorbitol","xylitol","erythritol"]
};

function suggestTags(text){
  var t = String(text||"").toLowerCase();
  if(t.length < 3) return [];
  var out = [];
  Object.keys(TAG_HINTS).forEach(function(tag){
    var hit = TAG_HINTS[tag].some(function(kw){
      var safe = kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return new RegExp("\\b" + safe).test(t);
    });
    if(hit) out.push(tag);
  });
  return out;
}

function pad(n){ return n < 10 ? "0"+n : ""+n; }
function localDate(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function localTime(d){ return pad(d.getHours())+":"+pad(d.getMinutes()); }
function dayKey(iso){ return localDate(new Date(iso)); }
function hhmm(iso){ return localTime(new Date(iso)); }
function isoFrom(dateStr, timeStr){
  var p = dateStr.split("-"), t = timeStr.split(":");
  return new Date(+p[0], +p[1]-1, +p[2], +t[0], +t[1]).toISOString();
}
function prettyDay(key){
  var today = localDate(new Date());
  var y = new Date(); y.setDate(y.getDate()-1);
  if(key === today) return "Today";
  if(key === localDate(y)) return "Yesterday";
  var d = new Date(key+"T12:00:00");
  return d.toLocaleDateString("en-GB",{weekday:"short", day:"numeric", month:"short"});
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function avg(arr){ return arr.length ? arr.reduce(function(a,b){return a+b;},0)/arr.length : null; }
function r1(n){ return n==null ? "–" : (Math.round(n*10)/10).toString(); }

var toastTimer;
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1800);
}

/* ---------- routing ---------- */
var view = document.getElementById("view");
var screen = "log";
var TITLES = {log:"Log", today:"History", stats:"Patterns", export:"Export",
              bm:"Bowel movement", meal:"Meal", drink:"Drink", med:"Medication", day:"Daily check-in"};

function go(s){
  screen = s;
  document.getElementById("screenTitle").textContent = TITLES[s] || "Log";
  var tab = (s==="bm"||s==="meal"||s==="drink"||s==="med"||s==="day") ? "log" : s;
  [].forEach.call(document.querySelectorAll("nav button"), function(b){
    if(b.dataset.tab === tab) b.setAttribute("aria-current","page");
    else b.removeAttribute("aria-current");
  });
  render();
  window.scrollTo(0,0);
}
[].forEach.call(document.querySelectorAll("nav button"), function(b){

});

function refreshCount(){

/* ---------- screen: log menu ---------- */
function renderLog(){
  var cutoff = Date.now() - 30*24*3600*1000;
  var recentFlag = db.entries.some(function(e){
    return e.type==="bm" && e.flags && new Date(e.ts).getTime() > cutoff &&
           (e.flags.indexOf("blood") > -1 || e.flags.indexOf("black") > -1);
  });
  // nudge to back up — losing the diary to a cleared browser is the real risk
  var nEntries = db.entries.length;
  var daysSince = db.lastBackup ? (Date.now() - db.lastBackup) / 86400000 : null;
  var needsBackup = nEntries >= 8 && (daysSince === null || daysSince > 5);

  view.innerHTML =
    (!STORAGE.canWrite ?
      '<div class="flagbanner"><b>This browser is not saving your diary.</b>' +
      'Anything you log here will vanish. Open the Export tab and send Claude what it says ' +
      'under "Storage check".' +
      (STORAGE.error ? '<br><br>' + esc(STORAGE.error) : "") + '</div>' : "") +
    (recentFlag ?
      '<div class="flagbanner"><b>You have logged blood or black stool in the last 30 days.</b>' +
      'That is past the point of self-managing. Book a GP appointment within 24&ndash;48 hours, ' +
      'or call 111. Show them the Export tab.</div>' : "") +
    (needsBackup ?
      '<div class="nudge"><b>Back up your diary</b>' +
      (daysSince === null
        ? 'You have ' + nEntries + ' entries and have never backed up. '
        : 'It has been ' + Math.floor(daysSince) + ' days since your last backup. ') +
      'Clearing your browser, or deleting and re-adding the home screen icon, would wipe all of it. ' +
      'Export &rarr; Download backup file, then email it to yourself.</div>' : "") +
    '<div class="actions">' +
      '<button class="action" data-go="bm">' +
        '<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 4 3 5 3 8a4 4 0 0 0 8 0c0-3 3-4 3-8a7 7 0 0 0-7-7z"/></svg>' +
        'Bowel movement</button>' +
      '<button class="action" data-go="meal">' +
        '<svg viewBox="0 0 24 24"><path d="M4 3v7a3 3 0 0 0 6 0V3M7 10v11M17 3c-1.5 1.5-2 3.5-2 6s.5 3 2 3v9"/></svg>' +
        'Meal</button>' +
      '<button class="action" data-go="drink">' +
        '<svg viewBox="0 0 24 24"><path d="M6 3h12l-1.5 17a1.5 1.5 0 0 1-1.5 1.3H9a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M6.6 9h10.8"/></svg>' +
        'Drink</button>' +
      '<button class="action" data-go="med">' +
        '<svg viewBox="0 0 24 24"><rect x="2.5" y="8" width="19" height="8" rx="4"/><path d="M12 8v8"/></svg>' +
        'Medication</button>' +
      '<button class="action secondary" data-go="day">' +

  var fText = document.getElementById("fText");

  var box   = document.getElementById("chipSuggest");

  function applyTag(tag){
    var real = document.querySelector('#chipTags button[data-val="' + tag + '"]');
    if(real) real.setAttribute("aria-pressed", "true");
  }
  function refreshSuggestions(){
    var chosen = segValues("#chipTags");
    var found = suggestTags(fText.value).filter(function(t){ return chosen.indexOf(t) === -1; });
    if(!found.length){ wrap.style.display = "none"; box.innerHTML = ""; return; }
    wrap.style.display = "";
    box.innerHTML = found.map(function(t){
        return '<button type="button" data-tag="' + esc(t) + '">+ ' + esc(t) + '</button>';
      }).join("") +
      (found.length > 1 ? '<button type="button" class="all" data-tag="__all">Add all ' + found.length + '</button>' : "");
    [].forEach.call(box.querySelectorAll("button"), function(b){
      b.addEventListener("click", function(){
        (b.dataset.tag === "__all" ? found : [b.dataset.tag]).forEach(applyTag);
        refreshSuggestions();
      });
    });
  }
  fText.addEventListener("input", refreshSuggestions);
  [].forEach.call(document.querySelectorAll("#chipTags button"), function(b){
    b.addEventListener("click", refreshSuggestions);
  });

  document.getElementById("saveMeal").addEventListener("click", function(){
    var txt = document.getElementById("fText").value.trim();

      text: txt, tags: tags, portion: segValue("#segPortion") || "normal"

/* ---------- screen: history ---------- */
function renderHistory(){
  if(!db.entries.length){
    view.innerHTML = '<p class="empty">Nothing logged yet.<br>Everything you record stays on this device.</p>';
    return;
  }
  var groups = {}, order = [];
  db.entries.slice().reverse().forEach(function(e){
    var k = e.type==="day" ? e.date : dayKey(e.ts);
    if(!groups[k]){ groups[k]=[]; order.push(k); }
    groups[k].push(e);
  });
  var html = "";
  order.forEach(function(k){
    var bms = groups[k].filter(function(e){ return e.type==="bm"; }).length;
    html += '<div class="daygroup">'+esc(prettyDay(k))+' &middot; '+bms+' bowel movement'+(bms===1?"":"s")+'</div>';
    groups[k].forEach(function(e){
      var title = "", meta = "";
      if(e.type==="bm"){
        title = "Type "+e.bristol+" &middot; "+esc(BRISTOL[e.bristol]);
        meta = "Urgency "+e.urgency+"/10 &middot; Pain "+e.pain+"/10 &middot; Anxiety "+e.anxiety+"/10 &middot; "+
               (e.location==="out"?"Out":"Home") +
               (e.flags && e.flags.length ? '<br><b style="color:var(--bad)">'+esc(e.flags.join(", "))+'</b>' : "") +
               (e.note ? "<br>"+esc(e.note) : "");
      } else if(e.type==="meal"){
        title = e.text ? esc(e.text) : "Meal";
        var bits = [];
        if(e.portion && e.portion !== "normal") bits.push(esc(e.portion)+" portion");
        if(e.tags && e.tags.length) bits.push(esc(e.tags.join(", ")));
        meta = bits.length ? bits.join(" &middot; ") : "Normal portion";
      } else if(e.type==="drink"){
        title = esc((e.kinds||[]).join(", ")) || "Drink";
        var dbits = [];
        if(e.size) dbits.push({sip:"a sip", glass:"a glass", large:"large", lots:"lots"}[e.size] || esc(e.size));
        if(e.text) dbits.push(esc(e.text));
        meta = dbits.join(" &middot; ");
      } else if(e.type==="med"){
        title = esc(e.med) + (e.dose ? " &middot; "+esc(e.dose) : "");
        meta = e.why ? esc(e.why) : "";
      } else {
        title = "Daily check-in";
        meta = (e.sleep!=null ? e.sleep+"h sleep &middot; " : "") +
               (e.fluid!=null ? e.fluid+" drinks &middot; " : "") + "Stress "+e.stress+"/10 &middot; " +
               (e.wentOut ? "went out" : "stayed in") + (e.note ? "<br>"+esc(e.note) : "");
      }
      html += '<div class="entry"><div class="time">'+hhmm(e.ts)+'</div>' +
              '<div class="body"><div class="title">'+title+'</div><div class="meta">'+meta+'</div></div>' +
              '<button class="del" data-id="'+e.id+'" aria-label="Delete entry">&times;</button></div>';
    });
  });
  view.innerHTML = html;
  [].forEach.call(view.querySelectorAll(".del"), function(b){
    b.addEventListener("click", function(){
      if(!confirm("Delete this entry?")) return;
      removeEntry(b.dataset.id);
      render();
    });
  });
}

/* ---------- stats ---------- */
function dayStats(){
  var byDay = {};
  db.entries.forEach(function(e){
    var k = e.type==="day" ? e.date : dayKey(e.ts);
    if(!byDay[k]) byDay[k] = {bms:[], meals:[], meds:[], day:null};
    if(e.type==="bm")   byDay[k].bms.push(e);
    if(e.type==="meal") byDay[k].meals.push(e);
    if(e.type==="med")  byDay[k].meds.push(e);
    if(e.type==="day")  byDay[k].day = e;
  });
  return byDay;
}

function renderStats(){
  var bms = db.entries.filter(function(e){ return e.type==="bm"; });
  if(bms.length < 3){
    view.innerHTML = '<p class="empty">Patterns appear once you\'ve logged a few bowel movements.<br><br>' +
      'Aim for 7 full days before reading anything into it.</p>';
    return;
  }
  var byDay = dayStats();
  var keys = Object.keys(byDay).sort();

  // home vs out days
  var homeCounts = [], outCounts = [];
  keys.forEach(function(k){
    var d = byDay[k];
    if(!d.bms.length) return;
    var wasOut = (d.day && d.day.wentOut) || d.bms.some(function(b){ return b.location==="out"; });
    (wasOut ? outCounts : homeCounts).push(d.bms.length);
  });

  var html = "";
  html += '<div class="stat"><div class="k">Bowel movements per day</div>' +
          '<div class="v">'+r1(avg(keys.map(function(k){return byDay[k].bms.length;}).filter(function(n,i){return byDay[keys[i]].bms.length>0;})))+
          ' <small>average over '+keys.filter(function(k){return byDay[k].bms.length>0;}).length+' days</small></div></div>';

  html += '<div class="grid2">' +
    '<div class="stat"><div class="k">Days at home</div><div class="v">'+r1(avg(homeCounts))+'</div>' +
      '<div class="sub">'+homeCounts.length+' day'+(homeCounts.length===1?"":"s")+'</div></div>' +
    '<div class="stat"><div class="k">Days out</div><div class="v">'+r1(avg(outCounts))+'</div>' +
      '<div class="sub">'+outCounts.length+' day'+(outCounts.length===1?"":"s")+'</div></div>' +
    '</div>';

  var ah = avg(homeCounts), ao = avg(outCounts);
  if(ah!=null && ao!=null && homeCounts.length>=2 && outCounts.length>=2){
    var diff = ao - ah;
    var verdict;
    if(diff >= 1.5) verdict = "Going out costs you about "+r1(diff)+" extra bowel movements a day. That gap is the anxiety component — it's measurable, and it's separately treatable.";
    else if(diff <= 0.5) verdict = "Barely any difference between home days and days out. That points away from anxiety being the driver and towards a purely physical cause — worth showing your GP.";
    else verdict = "A modest difference between home and out. Keep logging; it needs more days to be sure.";
    html += '<div class="stat"><div class="k">What this means</div><div class="sub" style="margin-top:2px;font-size:14px;color:var(--text)">'+verdict+'</div></div>';
  }

  html += '<h2>Averages</h2><div class="grid2">' +
    '<div class="stat"><div class="k">Bristol type</div><div class="v">'+r1(avg(bms.map(function(b){return b.bristol;})))+'</div><div class="sub">target: 4</div></div>' +
    '<div class="stat"><div class="k">Urgency</div><div class="v">'+r1(avg(bms.map(function(b){return b.urgency;})))+'<small>/10</small></div></div>' +
    '<div class="stat"><div class="k">Pain</div><div class="v">'+r1(avg(bms.map(function(b){return b.pain;})))+'<small>/10</small></div></div>' +
    '<div class="stat"><div class="k">Anxiety</div><div class="v">'+r1(avg(bms.map(function(b){return b.anxiety;})))+'<small>/10</small></div></div>' +
    '</div>';

  // last 14 days bar chart
  var last = keys.slice(-14);
  if(last.length > 1){
    var max = Math.max.apply(null, last.map(function(k){ return byDay[k].bms.length; })) || 1;
    html += '<h2>Last '+last.length+' days</h2><div class="stat">' +
      '<div class="bars">' + last.map(function(k){
        var n = byDay[k].bms.length;
        return '<div style="height:'+Math.max(2, Math.round(n/max*90))+'px" title="'+k+': '+n+'"></div>';
      }).join("") + '</div>' +
      '<div class="barlabels">' + last.map(function(k){
        return '<span>'+byDay[k].bms.length+'</span>';
      }).join("") + '</div></div>';
  }

  // trigger analysis
  var meals = db.entries.filter(function(e){
    return (e.type==="meal"  && ((e.tags && e.tags.length) || e.portion)) ||
           (e.type==="drink" && e.kinds && e.kinds.length);
  });
  if(meals.length >= 5){
    var baseBad = 0, baseTotal = 0, tagStats = {};
    meals.forEach(function(m){
      var t0 = new Date(m.ts).getTime();
      var followed = bms.some(function(b){
        var dt = new Date(b.ts).getTime() - t0;
        return dt > 0 && dt <= 6*3600*1000 && b.bristol >= 6;
      });
      baseTotal++; if(followed) baseBad++;
      var considered = (m.tags || m.kinds || []).slice();
      if(m.portion) considered.push("Portion: "+m.portion);
      considered.forEach(function(tag){
        if(!tagStats[tag]) tagStats[tag] = {n:0, bad:0};
        tagStats[tag].n++;
        if(followed) tagStats[tag].bad++;
      });
    });
    var baseRate = baseTotal ? baseBad/baseTotal : 0;
    var rows = Object.keys(tagStats)
      .filter(function(t){ return tagStats[t].n >= 3; })
      .map(function(t){ return {tag:t, n:tagStats[t].n, rate:tagStats[t].bad/tagStats[t].n}; })
      .sort(function(a,b){ return b.rate - a.rate; });
    if(rows.length){
      html += '<h2>Possible triggers</h2>' +
        '<p class="hint">How often a type 6 or 7 followed within 6 hours. Your overall rate is <b>'+
        Math.round(baseRate*100)+'%</b> — anything well above that is worth testing properly.</p>' +
        '<div class="stat" style="padding:6px 14px"><table><thead><tr><th>Food tag</th><th class="num">Times</th><th class="num">Followed by 6/7</th></tr></thead><tbody>' +
        rows.map(function(r){
          var pct = Math.round(r.rate*100);
          var col = r.rate > baseRate + 0.2 ? "var(--bad)" : (r.rate < baseRate - 0.2 ? "var(--accent)" : "var(--text)");
          return '<tr><td>'+esc(r.tag)+'</td><td class="num">'+r.n+'</td>' +
                 '<td class="num" style="color:'+col+';font-weight:600">'+pct+'%</td></tr>';
        }).join("") +
        '</tbody></table></div>' +
        '<p class="hint" style="margin-top:10px">This is a hint, not proof — a tag needs at least 3 meals before it shows, and you eat many things at once.</p>';
    }
  }

  view.innerHTML = html;
}

/* ---------- export ---------- */
function buildCSV(){
  var rows = [["date","time","type","bristol","urgency","pain","anxiety","location","red_flags","meal_or_med","portion","tags_or_dose","sleep_hours","fluid_glasses","stress","notes"]];
  db.entries.forEach(function(e){
    var d = e.type==="day" ? e.date : dayKey(e.ts);
    rows.push([
      d, hhmm(e.ts), e.type,
      e.bristol!=null?e.bristol:"", e.urgency!=null?e.urgency:"", e.pain!=null?e.pain:"",
      e.anxiety!=null?e.anxiety:"",
      e.location||"" , (e.flags && e.flags.length ? e.flags.join("; ") : ""), e.text||e.med||"",
      e.portion||e.size||"",
      (e.tags?e.tags.join("; "):"") || (e.kinds?e.kinds.join("; "):"") || e.dose || "",
      e.sleep!=null?e.sleep:"", e.fluid!=null?e.fluid:"", e.stress!=null?e.stress:"",
      e.note||e.why||""
    ]);
  });
  return rows.map(function(r){
    return r.map(function(c){
      c = String(c==null?"":c);
      return /[",\n]/.test(c) ? '"'+c.replace(/"/g,'""')+'"' : c;
    }).join(",");
  }).join("\r\n");
}

function buildSummary(){
  var bms = db.entries.filter(function(e){ return e.type==="bm"; });
  if(!bms.length) return "No bowel movements logged yet.";
  var byDay = dayStats();
  var keys = Object.keys(byDay).filter(function(k){ return byDay[k].bms.length>0; }).sort();
  var homeCounts = [], outCounts = [];
  keys.forEach(function(k){
    var d = byDay[k];
    var wasOut = (d.day && d.day.wentOut) || d.bms.some(function(b){ return b.location==="out"; });
    (wasOut ? outCounts : homeCounts).push(d.bms.length);
  });
  var bristolDist = {};
  bms.forEach(function(b){ bristolDist[b.bristol] = (bristolDist[b.bristol]||0)+1; });
  var distStr = Object.keys(bristolDist).sort().map(function(t){
    return "type "+t+": "+bristolDist[t]+" ("+Math.round(bristolDist[t]/bms.length*100)+"%)";
  }).join(", ");
  var medUse = {};
  db.entries.filter(function(e){return e.type==="med";}).forEach(function(m){
    medUse[m.med] = (medUse[m.med]||0)+1;
  });
  var medStr = Object.keys(medUse).length
    ? Object.keys(medUse).map(function(m){ return m+" x"+medUse[m]; }).join(", ")
    : "none logged";

  var L = [];
  L.push("BOWEL SYMPTOM DIARY");
  L.push("Period: "+keys[0]+" to "+keys[keys.length-1]+"  ("+keys.length+" days with entries)");
  L.push("");
  L.push("BOWEL MOVEMENTS");
  L.push("  Total logged: "+bms.length);
  L.push("  Average per day: "+r1(avg(keys.map(function(k){return byDay[k].bms.length;}))));
  L.push("  Range: "+Math.min.apply(null,keys.map(function(k){return byDay[k].bms.length;}))+
         " to "+Math.max.apply(null,keys.map(function(k){return byDay[k].bms.length;}))+" per day");
  L.push("  Bristol distribution: "+distStr);
  L.push("  Mean Bristol type: "+r1(avg(bms.map(function(b){return b.bristol;}))));
  L.push("");
  L.push("HOME vs AWAY (key comparison)");
  L.push("  Days at home: "+homeCounts.length+", average "+r1(avg(homeCounts))+" bowel movements/day");
  L.push("  Days out:     "+outCounts.length+", average "+r1(avg(outCounts))+" bowel movements/day");
  L.push("");
  L.push("SEVERITY (mean, 0-10)");
  L.push("  Urgency: "+r1(avg(bms.map(function(b){return b.urgency;}))));
  L.push("  Pain:    "+r1(avg(bms.map(function(b){return b.pain;}))));
  L.push("  Anxiety about toilet access: "+r1(avg(bms.map(function(b){return b.anxiety;}))));
  L.push("");
  L.push("NOCTURNAL (00:00-06:00)");
  var noct = bms.filter(function(b){ var h = new Date(b.ts).getHours(); return h < 6; });
  L.push("  "+noct.length+" of "+bms.length+" bowel movements ("+Math.round(noct.length/bms.length*100)+"%)");
  L.push("");
  var days = db.entries.filter(function(e){ return e.type==="day"; });
  var fluids = days.map(function(x){return x.fluid;}).filter(function(v){return v!=null;});
  var sleeps = days.map(function(x){return x.sleep;}).filter(function(v){return v!=null;});
  if(fluids.length || sleeps.length){
    L.push("DAILY AVERAGES");
    if(fluids.length) L.push("  Fluid intake: "+r1(avg(fluids))+" glasses/day (recorded on "+
                             fluids.length+" day"+(fluids.length===1?"":"s")+")");
    if(sleeps.length) L.push("  Sleep: "+r1(avg(sleeps))+" hours/night");
    L.push("");
  }
  L.push("MEDICATION LOGGED");
  L.push("  "+medStr);
  L.push("");
  L.push("RED FLAGS");
  var fl = {blood:0, black:0, mucus:0};
  bms.forEach(function(b){
    (b.flags||[]).forEach(function(f){ if(fl[f]!=null) fl[f]++; });
  });
  if(!fl.blood && !fl.black && !fl.mucus){
    L.push("  None recorded across "+bms.length+" logged bowel movements.");
  } else {
    if(fl.blood) L.push("  *** FRESH RED BLOOD: "+fl.blood+" episode(s) ***");
    if(fl.black) L.push("  *** BLACK / TARRY STOOL: "+fl.black+" episode(s) ***");
    if(fl.mucus) L.push("  Mucus: "+fl.mucus+" episode(s)");
  }
  L.push("");
  L.push("Full day-by-day CSV available on request.");
  return L.join("\n");
}

function download(name, text, mime){
  try{
    var blob = new Blob([text], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    toast("Downloaded");
  }catch(e){ alert("Download failed on this browser. Use 'Copy summary' instead."); }
}

function renderExport(){
  var n = db.entries.length;
  view.innerHTML =
    '<h2>Storage &amp; sync</h2>' +
    '<div class="stat"><div style="font-size:14px;line-height:1.7">' +
      'Can save right now: <b style="color:' + (STORAGE.canWrite ? 'var(--accent)' : 'var(--bad)') + '">' +
        (STORAGE.canWrite ? 'YES' : 'NO') + '</b><br>' +
      'Survived a previous visit: <b style="color:' + (STORAGE.survived ? 'var(--accent)' : 'var(--bad)') + '">' +
        (STORAGE.survived ? 'YES' : 'NO') + '</b><br>' +
      'Entries held now: <b>' + db.entries.length + '</b><br>' +
      'Sync: ' + (!syncKey
          ? '<b style="color:var(--warn)">not set up on this device</b>'
          : (sync.ok === true
              ? '<b style="color:var(--accent)">working</b>'
              : (sync.ok === false
                  ? '<b style="color:var(--warn)">not connecting</b>' +
                    (sync.error ? ' &mdash; ' + esc(sync.error) : "")
                  : '<b style="color:var(--muted)">not tried yet</b>'))) +
      (db.lastSync ? '<br>Last synced: ' + esc(new Date(db.lastSync).toLocaleString("en-GB")) : "") +
      (STORAGE.error ? '<br>Error: <b style="color:var(--bad)">' + esc(STORAGE.error) + '</b>' : "") +
    '</div></div>' +
    (syncKey
      ? '<button class="btn ghost" id="syncNow">Sync now</button>'
      : '<div class="field" style="margin-top:4px">' +
          '<label>Pair this device &mdash; paste your sync key</label>' +
          '<input type="text" id="fKey" placeholder="the long code from your setup link" ' +
            'autocapitalize="off" autocorrect="off" spellcheck="false">' +
        '</div>' +
        '<button class="btn" id="saveKey">Pair this device</button>') +
    '<p class="hint" style="margin-top:12px">' +
      (syncKey
        ? 'Your phone and PC share one diary. When there\'s no signal it keeps everything ' +
          'locally and catches up next time &mdash; nothing is lost either way.'
        : 'This device hasn\'t been paired yet. Open the setup link Claude gave you, once, ' +
          'on this device.') +
    '</p>' +
    '<h2 style="margin-top:32px">For your GP</h2>' +
    '<pre class="summary" id="sum">'+esc(buildSummary())+'</pre>' +
    '<div style="margin-top:12px">' +
      '<button class="btn" id="copySum">Copy summary</button>' +
      '<button class="btn ghost" id="dlSum">Download summary (.txt)</button>' +
      '<button class="btn ghost" id="dlCsv">Download full data (.csv)</button>' +
    '</div>' +
    '<h2 style="margin-top:32px">Backup</h2>' +
    '<p class="hint">Your diary lives in this browser only. Clearing your browsing data would wipe it, ' +
    'so download a backup once a week and keep it somewhere safe.</p>' +
    '<button class="btn ghost" id="dlJson">Download backup file</button>' +
    '<label class="btn ghost" for="impFile" style="display:block;text-align:center;cursor:pointer;margin-top:10px">' +
      'Restore from a backup</label>' +
    '<input type="file" id="impFile" accept=".json,application/json" style="position:absolute;width:1px;height:1px;opacity:0">' +
    '<p class="hint" style="margin-top:10px">Restoring adds entries you don\'t already have. It never ' +
    'overwrites or deletes what\'s here, so it\'s safe to run twice.</p>' +
    '<h2 style="margin-top:32px">Start over</h2>' +
    '<button class="btn danger" id="wipe">Delete everything</button>';

  var syncBtn = document.getElementById("syncNow");
  if(syncBtn) syncBtn.addEventListener("click", function(){
    toast("Syncing…");
    syncNow();
  });

  var pairBtn = document.getElementById("saveKey");
  if(pairBtn) pairBtn.addEventListener("click", function(){
    var k = (document.getElementById("fKey").value || "").trim();
    // tolerate a whole link being pasted, not just the key
    var m = /key=([A-Za-z0-9_-]{16,})/.exec(k);
    if(m) k = m[1];
    if(!/^[A-Za-z0-9_-]{16,}$/.test(k)){ toast("That doesn't look like the key"); return; }
    try{ localStorage.setItem(KEY_STORE, k); }catch(e){}
    syncKey = k;
    sync.ok = null; sync.error = null;
    toast("Paired");
    syncNow();
    render();
  });
  document.getElementById("copySum").addEventListener("click", function(){
    var txt = buildSummary();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast("Copied"); },
                                              function(){ legacyCopy(txt); });
    } else legacyCopy(txt);
  });
  function legacyCopy(txt){
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("Copied"); }
    catch(e){ toast("Select the text above to copy"); }
    document.body.removeChild(ta);
  }
  document.getElementById("dlSum").addEventListener("click", function(){
    download("gut-summary-"+localDate(new Date())+".txt", buildSummary(), "text/plain");
  });
  document.getElementById("dlCsv").addEventListener("click", function(){
    download("gut-data-"+localDate(new Date())+".csv", buildCSV(), "text/csv");
  });
  document.getElementById("dlJson").addEventListener("click", function(){
    download("gut-backup-"+localDate(new Date())+".json", JSON.stringify(db), "application/json");
    db.lastBackup = Date.now();
    save();
  });
  document.getElementById("impFile").addEventListener("change", function(){
    var file = this.files && this.files[0];
    this.value = "";
    if(!file) return;
    var fr = new FileReader();
    fr.onerror = function(){ alert("Couldn't read that file. Try downloading a fresh backup."); };
    fr.onload = function(){
      var incoming;
      try{
        incoming = JSON.parse(fr.result);
      }catch(err){
        alert("That isn't a backup file. Pick the .json file you downloaded from Backup — not the .csv or the .txt.");
        return;
      }
      if(!incoming || !Array.isArray(incoming.entries)){
        alert("That file doesn't contain any diary entries. Pick the .json file you downloaded from Backup.");
        return;
      }
      var have = {};
      db.entries.forEach(function(e){ have[e.id] = true; });
      var added = 0, skipped = 0;
      incoming.entries.forEach(function(e){
        if(!e || !e.id || !e.ts){ skipped++; return; }
        if(have[e.id]){ skipped++; return; }
        db.entries.push(e); have[e.id] = true; added++;
      });
      db.entries.sort(function(a,b){ return a.ts < b.ts ? -1 : 1; });
      save();
      alert("Restored.\n\n" + added + " new entr" + (added===1?"y":"ies") + " added.\n" +
            skipped + " already here, so left alone.\n\nNothing was overwritten or deleted.");
      render();
    };
    fr.readAsText(file);
  });
  document.getElementById("wipe").addEventListener("click", function(){
    if(!confirm("Delete all logged data, on every device? This cannot be undone.")) return;
    if(!confirm("Really sure? Download a backup first if you want a copy.")) return;
    // tombstone everything so the deletion travels, rather than syncing back
    var ids = db.entries.map(function(e){ return e.id; });
    db.deleted = (db.deleted || []).concat(ids);
    db.entries = [];
    save(); syncSoon(); toast("Deleted"); go("log");
  });
}

/* ---------- offline ----------
   Only does anything when served from a real https origin with sw.js
   alongside it. Fails silently everywhere else. */
if("serviceWorker" in navigator && location.protocol === "https:"){
  navigator.serviceWorker.register("./sw.js").catch(function(){});
}

/* ---------- go ---------- */
go("log");
syncNow();
// pick up anything logged on the other device when returning to the app
document.addEventListener("visibilitychange", function(){
  if(!document.hidden) syncSoon();
});

})();
</script>
